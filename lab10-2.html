<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>북마크 매니저</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .form input {
            flex: 1;
            padding: 0.5rem;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
        }

        .name {
            flex: 1;
            cursor: pointer;
            color: #0066cc;
        }

        .name:hover {
            text-decoration: underline;
        }

        .star {
            cursor: pointer;
            user-select: none;
            color: #ccc;
            font-size: 1.2rem;
        }

        .star.active {
            color: gold;
        }

        .delete-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>나의 북마크</h1>
    <div class="form">
        <input type="text" id="nameInput" placeholder="사이트 이름">
        <input type="url" id="urlInput" placeholder="https://...">
        <button id="addBtn">추가</button>
    </div>
    <ul id="bookmarkList"></ul>

    <script>
        const nameInput = document.querySelector('#nameInput');
        const urlInput = document.querySelector('#urlInput');
        const addBtn = document.querySelector('#addBtn');
        const list = document.querySelector('#bookmarkList');

        // 데이터 모델: [{ id, name, url, starred }, ...]
        let bookmarks = [{ id: 1, name: "Google", url: "https://www.google.com", starred: false }];

        // TODO 1: 페이지 로드 시 localStorage에서 bookmarks 배열 복원 + 렌더링
        //         힌트: JSON.parse, render() 호출
        const savedBookmarks = localStorage.getItem('bookmarks'); //저장된 북마크 가져오기
        if (savedBookmarks) { //저장된 북마크가 있다면
            bookmarks = JSON.parse(savedBookmarks); //북마크 문자열을 객체로 변환하여 bookmarks에 저장 (GitHub Copilot으로 생성 후 검증 완료)
        }
        render(); //배열 출력하는 함수 호출

        // TODO 2: render() — bookmarks 배열을 화면에 그리기
        //         힌트: list.innerHTML = bookmarks.map(b => `<li data-id="${b.id}">...</li>`).join('')
        function render() { //북마크 배열을 화면에 그리는 함수 (GitHub Copilot으로 생성 후 검증 완료)
            //각 북마크 당 클릭 시 새 탭으로 열기, 별표 토글, 삭제 버튼 만들기
            list.innerHTML = bookmarks.map(b => `
                <li data-id="${b.id}">
                    <span class="name">${b.name}</span>
                    <span class="star ${b.starred ? 'active' : ''}">★</span>
                    <button class="delete-btn">삭제</button>
                </li>
            `).join(''); //배열을 하나의 문자열로 합치기 위해
        }

        // TODO 3: 추가 버튼 — 이름+URL 받아서 bookmarks에 추가 + 저장 + 렌더링
        addBtn.addEventListener('click', () => {
            const name = nameInput.value.trim(); //.trim()으로 앞뒤 공백 제거
            const url = urlInput.value.trim();
            if (name && url) { //이름과 URL이 모두 입력되었는지 확인
                const newBookmark = {
                    id: Date.now(),
                    name,
                    url,
                    starred: false //디폴트: 즐겨찾기 해제
                };
                bookmarks.push(newBookmark); //배열에 새 북마크 추가 (GitHub Copilot으로 생성 후 검증 완료)
                localStorage.setItem('bookmarks', JSON.stringify(bookmarks)); //JSON직렬화
                render();
                nameInput.value = ''; //입력 필드 초기화
                urlInput.value = '';
            } else {
                alert('사이트 이름과 URL을 모두 입력하세요.');
            }
        });

        // TODO 4: 이벤트 위임 — list에 click 1개로 별표 토글 / 삭제 / 사이트명 클릭 시 window.open
        list.addEventListener('click', (e) => { //(GitHub Copilot으로 생성 후 검증 완료)
            const li = e.target.closest('li'); //클릭한 요소에서 가장 가까운 li 요소 찾기
            if (!li) return; //li 바깥 클릭 무시
            const id = parseInt(li.dataset.id); //li의 data-id 속성에서 id 가져와서
            const bookmark = bookmarks.find(b => b.id === id); //id에 해당하는 북마크 객체 찾기
            if (e.target.classList.contains('star')) {
                // 별표 토글
                bookmark.starred = !bookmark.starred;
                localStorage.setItem('bookmarks', JSON.stringify(bookmarks)); //저장
                render();
            } else if (e.target.classList.contains('delete-btn')) {
                // 삭제
                bookmarks = bookmarks.filter(b => b.id !== id); //삭제 대상 제외한 배열을 새로 저장
                localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
                render();
            } else if (e.target.classList.contains('name')) {
                // 사이트명 클릭
                window.open(bookmark.url, '_blank'); //새 탭에서 열기
            }
        });
    </script>
</body>

</html>
